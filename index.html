<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0b">
<title>The New Quest</title>
<style>
:root{--bg:#0b0b0b;--card:#171717;--line:#2a2a2a;--y:#FFD600;--w:#fff;--mut:#a8a8a8;--ok:#7dff9b;--bad:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--w);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45}
body{padding-bottom:84px;overflow-x:hidden}
main{max-width:560px;margin:0 auto;padding:16px}
h1,h2,h3{margin:0 0 8px;line-height:1.15;letter-spacing:-.01em}
h1{font-size:2.2rem;font-weight:900;text-transform:uppercase}
h2{font-size:1.5rem;font-weight:800}
h3{font-size:1.05rem}
.y{color:var(--y)}.mut{color:var(--mut);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.hero{border-color:var(--y);background:linear-gradient(160deg,#1c1a05,#0b0b0b)}
.logo{display:inline-flex;align-items:center;gap:8px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.logo b{background:var(--y);color:#000;padding:2px 9px;border-radius:8px;transform:rotate(-3deg)}
button,.btn{display:block;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--y);color:#000;font:800 1rem inherit;text-align:center;text-decoration:none;padding:14px;cursor:pointer;margin-top:12px}
button.ghost,.btn.ghost{background:transparent;color:var(--w);border:2px solid var(--line)}
button:disabled{opacity:.5}
label{display:block;margin-top:12px;font-weight:700;font-size:.9rem}
input,select,textarea{width:100%;min-height:50px;margin-top:6px;padding:12px;border-radius:12px;border:2px solid var(--line);background:#0f0f0f;color:var(--w);font:inherit}
textarea{min-height:90px}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible,nav a:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-top:12px}
.chk input{width:24px;min-height:24px;margin:2px 0 0;flex:none}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#0f0f0f;border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:1.6rem;color:var(--y)}
.bar{height:12px;background:#262626;border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--y);border-radius:99px}
.pill{display:inline-block;font-size:.75rem;font-weight:800;padding:3px 10px;border-radius:99px;border:1px solid var(--line);text-transform:uppercase}
.s-available{background:var(--y);color:#000;border-color:var(--y)}
.s-submitted{color:var(--y);border-color:var(--y)}
.s-completed{background:var(--ok);color:#000;border-color:var(--ok)}
.s-expired,.s-upcoming{color:var(--mut)}
.msg{padding:12px;border-radius:12px;margin:12px 0;font-weight:600}
.msg.err{background:#2a1212;color:var(--bad);border:1px solid var(--bad)}
.msg.ok{background:#10240f;color:var(--ok);border:1px solid var(--ok)}
.msg.info{background:#1c1a05;color:var(--y);border:1px solid #4d4300}
.id{font-size:2rem;font-weight:900;letter-spacing:.12em;color:var(--y);text-align:center;border:2px dashed var(--y);border-radius:14px;padding:14px;margin:12px 0}
.lb{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--line)}
.lb:last-child{border:0}.lb.me{background:#1c1a05;border-radius:12px;border:1px solid var(--y)}
.lb .rk{width:36px;font-weight:900;font-size:1.2rem;text-align:center}.lb .nm{flex:1;font-weight:700}.lb .pt{font-weight:900;color:var(--y)}
.tabs{display:flex;gap:8px}.tabs button{margin:0;min-height:46px}
nav{position:fixed;left:0;right:0;bottom:0;background:#0b0b0bee;backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;color:var(--mut);text-decoration:none;font-size:.72rem;font-weight:700;padding:10px 2px;min-height:56px}
nav a span{display:block;font-size:1.3rem}
nav a.on{color:var(--y)}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--y);border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.load{text-align:center;padding:40px}
a{color:var(--y)}
small{color:var(--mut)}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<main id="app" tabindex="-1" aria-live="polite"></main>
<nav id="nav" hidden aria-label="Main">
  <a href="#/dashboard"><span>🏠</span>Home</a>
  <a href="#/quests"><span>🎯</span>Quests</a>
  <a href="#/leaderboard"><span>🏆</span>Ranks</a>
  <a href="#/profile"><span>👤</span>Profile</a>
</nav>

<script>
/* ===== CONFIG ===== */
const CFG = {
  API: "https://script.google.com/macros/s/AKfycbxdSWJ8sH2Oq24fkx6UTRsb8PNRVW9nenDVjq2AdIOm2KpKyz6dWrHoqRiB6v5-vR7d6w/exec",
  TALLY: "https://tally.so/r/jebkx9",
  START: "2026-11-08", DAYS: 23, TZ: "Africa/Lagos",
  TRIBES: ["Surulere","Yaba 1","Yaba 2","Central","Campus (Unilag)","Campus (Yaba tech)"],
  DEMO_FALLBACK: false   // set true only to preview with sample data
};

/* ===== HELPERS ===== */
const $ = s => document.querySelector(s);
const e = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lagosToday = () => new Intl.DateTimeFormat("en-CA", {timeZone: CFG.TZ}).format(new Date());
const dayDiff = (a, b) => Math.round((Date.parse(a) - Date.parse(b)) / 864e5);
const challengeDay = () => dayDiff(lagosToday(), CFG.START) + 1;      // 1..23, <1 before, >23 after
const dateOfDay = n => new Date(Date.parse(CFG.START) + (n - 1) * 864e5);
const fmtDay = n => dateOfDay(n).toLocaleDateString("en-GB", {day:"numeric", month:"short", timeZone:"UTC"});
const medal = r => ["🥇","🥈","🥉"][r - 1] || r;
const S = {
  get sess(){ try{return JSON.parse(localStorage.getItem("nq_sess")||"null")}catch(_){return null} },
  set sess(v){ try{ v ? localStorage.setItem("nq_sess", JSON.stringify(v)) : localStorage.removeItem("nq_sess") }catch(_){} }
};
let demoMode = false;

/* ===== API (Google Apps Script) ===== */
async function api(action, data = {}) {
  const sess = S.sess;
  const body = JSON.stringify({action, ...data, playerId: data.playerId || sess?.playerId, token: sess?.token});
  try {
    const r = await fetch(CFG.API, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body});
    const j = await r.json();
    if (j.ok === false) throw Object.assign(new Error(j.error || "Request failed"), {server: true});
    return j;
  } catch (err) {
    if (err.server || !CFG.DEMO_FALLBACK) throw err;
    demoMode = true;
    return demo(action, data);
  }
}

/* ===== DEMO DATA (used only if backend is unreachable) ===== */
const DEMO_Q = [
  [1,"Feed Someone","Buy a meal or snack for someone and share the moment (no faces required).",10,0,"Post URL + short note. Alternative: share food from home."],
  [2,"Team Selfie","Take a picture with a service team member. Ask permission first.",10,5,"Photo post tagging the church account."],
  [3,"Invite a Friend","Invite a friend to church and post about it.",10,10,"Post URL. Do not publish anyone’s details without consent."],
  [4,"Treasureville Volunteer","Volunteer with Treasureville and share your experience.",10,10,"Post URL + note. Follow facility and safeguarding rules."],
  [5,"Immerse Together","Attend Immerse with a friend.",10,5,"Post URL."],
  [6,"Feast Content","Create content about Feast.",10,5,"Post URL with required hashtags."]
].map(([n,t,d,p,b,ev]) => ({n,title:t,desc:d,points:p,bonus:b,evidence:ev}));
const dstore = () => JSON.parse(localStorage.getItem("nq_demo") || '{"subs":[],"pts":0}');
function demo(action, d) {
  const st = dstore(), save = () => localStorage.setItem("nq_demo", JSON.stringify(st));
  switch (action) {
    case "register": return {ok:true, playerId:"NQ-" + Math.random().toString(36).slice(2,6).toUpperCase(), demoCode:"123456"};
    case "sendCode": case "recover": return {ok:true};
    case "verify": return {ok:true, token:"demo", playerId:d.playerId, name:"Demo Player"};
    case "quests": return {ok:true, quests:DEMO_Q.map(q => ({...q, status:st.subs.includes(q.n) ? "submitted" : null}))};
    case "dashboard": return {ok:true, name:"Demo Player", tribe:"Yaba 1", points:st.pts, rank:4, tribeRank:2, streak:st.subs.length, done:st.subs.length, top:[{name:"Player One",points:245},{name:"Player Two",points:220},{name:"Player Three",points:195}]};
    case "leaderboard": return {ok:true, updated:new Date().toISOString(), me:d.playerId,
      individuals:[["Player One",245],["Player Two",220],["Player Three",195],["Player Four",180],["Player Five",160]].map(([name,points],i)=>({rank:i+1,name,points})),
      tribes:CFG.TRIBES.map((name,i)=>({rank:i+1,name,points:Math.round(52-i*6.5)}))};
    case "profile": return {ok:true, name:"Demo Player", tribe:"Yaba 1", handle:"@demo", points:st.pts, rank:4, bonus:0, streak:st.subs.length, achievements:st.subs.length?["First Quest"]:[], history:st.subs.map(n=>({quest:n,url:"https://example.com",points:15}))};
    case "submit": if (st.subs.includes(+d.quest)) throw Object.assign(new Error("You already submitted this quest."), {server:true});
      st.subs.push(+d.quest); st.pts += 15; save(); return {ok:true, awarded:15, total:st.pts};
    case "updateHandle": case "requestHelp": return {ok:true};
  }
  return {ok:true};
}

/* ===== UI PIECES ===== */
const loading = () => `<div class="load"><div class="spin" role="status" aria-label="Loading"></div><p class="mut">Loading…</p></div>`;
const errBox = m => `<div class="msg err" role="alert">${e(m)}</div>`;
const banner = () => demoMode ? `<div class="msg info">Demo mode: the backend couldn’t be reached, so sample data is shown.</div>` : "";
const logo = () => `<div class="logo"><b>THE</b> NEW QUEST</div>`;
function view(html){ $("#app").innerHTML = html; $("#nav").hidden = !S.sess; window.scrollTo(0,0);
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === location.hash.split("?")[0])); }
const form = (id, handler) => { const f = document.getElementById(id); f && f.addEventListener("submit", async ev => {
  ev.preventDefault(); const b = f.querySelector("button[type=submit]"), box = f.querySelector(".fb"); b.disabled = true; box.innerHTML = "";
  try { await handler(Object.fromEntries(new FormData(f))); } catch (x) { box.innerHTML = errBox(x.message || "Something went wrong. Please try again."); b.disabled = false; } }); };
const needLogin = () => { if (!S.sess) { location.hash = "#/login"; return true; } };

/* ===== PAGES ===== */
function welcome() {
  const d = challengeDay();
  const status = d < 1 ? `Opens ${fmtDay(1)} · ${dayDiff(CFG.START, lagosToday())} day(s) to go` : d <= CFG.DAYS ? `Day ${d} of ${CFG.DAYS} is live` : "Challenge complete";
  view(`${logo()}
  <section class="card hero"><span class="pill s-available">${e(status)}</span>
    <h1 style="margin-top:12px">Join the <span class="y">Quest</span></h1>
    <p>${CFG.DAYS} days of daily quests. Serve, share, invite and win for your Tribe.</p>
    <p class="mut">8 – 30 November 2026 · Lagos time</p>
    <a class="btn" href="#/register">Join the Quest</a>
    <a class="btn ghost" href="#/login">I already have a Player ID</a></section>
  <section class="card"><h3>How it works</h3><p class="mut">Complete the day’s quest, post about it, submit your link and earn points: 10 per quest, +5 for tags, bonus and surprise quests, streak and completion rewards. Tribes are ranked by <b>average points per member</b>.</p></section>`);
}
function register() {
  view(`<a href="#/welcome" class="mut">← Back</a><h2>Register</h2>
  <form id="f" class="card" novalidate>
    <label>Display name<input name="name" required autocomplete="nickname" maxlength="40"></label>
    <label>Email (for your one-time code)<input name="email" type="email" inputmode="email" required autocomplete="email"></label>
    <label>Phone number (private)<input name="phone" type="tel" inputmode="tel" required autocomplete="tel" placeholder="+234…"></label>
    <label>Social media handle<input name="handle" required placeholder="@yourhandle"></label>
    <label>Tribe<select name="tribe" required><option value="">Select your Tribe</option>${CFG.TRIBES.map(t=>`<option>${e(t)}</option>`).join("")}</select></label>
    <label>Show on leaderboard as<select name="nameMode"><option value="display">My display name</option><option value="first">First name only</option></select></label>
    <label class="chk"><input type="checkbox" name="rules" required> <span>I agree to the challenge rules. I will get consent before posting identifiable photos of others and will never record strangers’ faces, conversations or prayers.</span></label>
    <label class="chk"><input type="checkbox" name="consent" required> <span>I consent to my display name and score appearing on the public leaderboard. My phone number is never shown. Evidence is used only to verify points and kept until the challenge ends.</span></label>
    <div class="fb"></div><button type="submit">Create my profile</button></form>`);
  form("f", async d => {
    if (!d.name.trim() || !d.phone.trim() || !d.handle.trim() || !d.tribe) throw new Error("Please complete every field.");
    if (!d.rules || !d.consent) throw new Error("Please accept the rules and leaderboard consent.");
    const r = await api("register", {...d, rules:true, consent:true});
    confirmScreen(r.playerId, r.demoCode);
  });
}
function confirmScreen(id, code) {
  view(`${logo()}<div class="card hero"><h2>You’re in! 🎉</h2><p>Your Player ID:</p><div class="id">${e(id)}</div>
  <p class="mut">Save it. We emailed you a one-time code. Enter it to start (check spam if you can’t see it).</p>
  <form id="f"><label>One-time code<input name="code" inputmode="numeric" autocomplete="one-time-code" required value="${e(code||"")}"></label>
  <div class="fb"></div><button type="submit">Verify & enter</button></form></div>`);
  form("f", async d => { const r = await api("verify", {playerId:id, code:d.code}); S.sess = {playerId:id, token:r.token}; location.hash = "#/dashboard"; });
}
function login() {
  view(`<a href="#/welcome" class="mut">← Back</a><h2>Sign in</h2>
  <form id="f" class="card"><label>Player ID<input name="id" required autocapitalize="characters" placeholder="NQ-XXXX"></label>
  <div id="step2" hidden><label>One-time code<input name="code" inputmode="numeric" autocomplete="one-time-code"></label></div>
  <div class="fb"></div><button type="submit" id="go">Send me a code</button></form>
  <form id="g" class="card"><h3>Lost your Player ID?</h3><p class="mut">We’ll email it to you. It’s never shown on screen.</p>
  <label>Registered email<input name="email" type="email" required></label><div class="fb"></div><button type="submit" class="ghost">Send my Player ID</button></form>`);
  let sent = false;
  form("f", async d => { const id = d.id.trim().toUpperCase();
    if (!sent) { await api("sendCode", {playerId:id}); sent = true; $("#step2").hidden = false; $("#go").textContent = "Verify & sign in"; $("#f .fb").innerHTML = `<div class="msg ok">Code sent to your email.</div>`; $("#go").disabled = false; return; }
    const r = await api("verify", {playerId:id, code:d.code}); S.sess = {playerId:id, token:r.token}; location.hash = "#/dashboard"; });
  form("g", async d => { await api("recover", {email:d.email}); $("#g .fb").innerHTML = `<div class="msg ok">If that email is registered, your Player ID is on its way.</div>`; $("#g button").disabled = false; });
}
async function dashboard() {
  if (needLogin()) return; view(loading());
  try {
    const [d, q] = await Promise.all([api("dashboard"), api("quests")]);
    const day = challengeDay(), quests = qList(q.quests), today = quests.find(x => x.n === day);
    const done = d.done ?? quests.filter(x => ["submitted","completed"].includes(x.status)).length;
    const pct = Math.min(100, Math.round(done / CFG.DAYS * 100));
    let hero;
    if (day < 1) hero = `<div class="card hero"><h3>Get ready</h3><p class="mut">The first quest opens ${fmtDay(1)} at 12:00 a.m. Lagos time. Check back then!</p></div>`;
    else if (day > CFG.DAYS) hero = `<div class="card hero"><h3>Challenge complete 🏁</h3><p class="mut">Final standings are on the leaderboard.</p></div>`;
    else if (!today) hero = `<div class="card hero"><h3>Day ${day}</h3><p class="mut">Today’s quest isn’t published yet. Check back soon.</p></div>`;
    else if (today.status === "submitted" || today.status === "completed") hero = `<div class="card hero"><span class="pill s-completed">Done today ✓</span><h3 style="margin-top:8px">${e(today.title)}</h3><p class="mut">Submission received. Come back tomorrow to keep your streak!</p></div>`;
    else hero = `<div class="card hero"><span class="pill s-available">Day ${day} · Today’s quest</span><h3 style="margin-top:8px">${e(today.title)}</h3><p>${e(today.desc)}</p><a class="btn" href="#/submit/${today.n}">Submit Quest</a><a class="btn ghost" href="#/quest/${today.n}">View Quest</a></div>`;
    view(`${banner()}<div class="row">${logo()}<small>${e(d.playerId || S.sess.playerId)}</small></div>
    <h2 style="margin-top:14px">Hey, ${e(d.name)} 👋</h2>${hero}
    <div class="grid"><div class="stat"><small>Verified points</small><b>${d.points}</b></div><div class="stat"><small>Your rank</small><b>#${d.rank ?? "–"}</b></div>
    <div class="stat"><small>${e(d.tribe)}</small><b>#${d.tribeRank ?? "–"}</b></div><div class="stat"><small>Streak</small><b>🔥 ${d.streak}</b></div></div>
    <div class="card"><div class="row"><h3>Quest progress</h3><small>${done}/${CFG.DAYS}</small></div><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div></div>
    <div class="card"><h3>Top 3</h3>${(d.top||[]).length ? d.top.map((p,i)=>`<div class="lb"><span class="rk">${medal(i+1)}</span><span class="nm">${e(p.name)}</span><span class="pt">${p.points} pts</span></div>`).join("") : `<p class="mut">No scores yet. Be the first!</p>`}
    <a class="btn ghost" href="#/leaderboard">Full leaderboard</a></div>`);
  } catch (x) { view(errBox(x.message) + `<button onclick="route()">Try again</button>`); }
}
function qList(list) {
  const day = challengeDay();
  return list.map(q => { let s = q.status;
    if (!s) s = q.n > day ? "upcoming" : q.n < day ? "expired" : "available";
    return {...q, status:s}; });
}
async function quests() {
  if (needLogin()) return; view(loading());
  try {
    const list = qList((await api("quests")).quests);
    view(`${banner()}<h2>Quest Board</h2>${list.length ? list.map(q => `<a href="#/quest/${q.n}" style="text-decoration:none;color:inherit"><div class="card">
      <div class="row"><small>QUEST ${q.n} · ${fmtDay(q.n)}</small><span class="pill s-${q.status}">${q.status}</span></div>
      <h3 style="margin-top:6px">${e(q.title)} ${q.bonus ? "⭐" : ""}</h3><p class="mut">${e(q.desc)}</p>
      <div class="row"><b class="y">${q.points} pts${q.bonus ? ` + ${q.bonus} bonus` : ""}</b><small>Opens 12:00am · closes 11:59pm</small></div></div></a>`).join("") : `<div class="card"><p class="mut">No quests published yet. Check back soon.</p></div>`}`);
  } catch (x) { view(errBox(x.message)); }
}
async function questDetail(n) {
  if (needLogin()) return; view(loading());
  try {
    const q = qList((await api("quests")).quests).find(x => x.n === +n);
    if (!q) return view(errBox("Quest not found.") + `<a class="btn" href="#/quests">Back to quests</a>`);
    view(`<a href="#/quests" class="mut">← Quests</a><div class="card hero"><span class="pill s-${q.status}">${q.status}</span><h2 style="margin-top:10px">#${q.n} ${e(q.title)}</h2>
    <p>${e(q.desc)}</p><p><b class="y">${q.points} pts</b>${q.bonus ? ` · ⭐ Bonus up to ${q.bonus} pts` : ""}</p>
    <p class="mut">Open: ${fmtDay(q.n)}, 12:00 a.m. → 11:59 p.m. (Lagos)</p></div>
    <div class="card"><h3>Evidence needed</h3><p>${e(q.evidence || "Post URL on the platform you used.")}</p></div>
    <div class="card"><h3>Stay safe & respectful</h3><p class="mut">Get consent before posting anyone’s photo. Never record strangers, conversations or prayers. Follow instructions from service teams and respect church facilities. Not comfortable with a quest (money, physical contact, sensitive situations)? Ask an organiser for an alternative.</p></div>
    ${q.status === "available" ? `<a class="btn" href="#/submit/${q.n}">Submit Quest</a>` : q.status === "submitted" || q.status === "completed" ? `<div class="msg ok">Submitted ✓</div>` : `<div class="msg info">${q.status === "upcoming" ? "This quest isn’t open yet." : "This quest has closed."}</div>`}`);
  } catch (x) { view(errBox(x.message)); }
}
async function submitPage(n) {
  if (needLogin()) return; view(loading());
  try {
    const q = qList((await api("quests")).quests).find(x => x.n === +n);
    if (!q || q.status !== "available") return view(`<div class="msg err">${!q ? "Quest not found." : q.status === "submitted" || q.status === "completed" ? "You’ve already submitted this quest." : "This quest isn’t open for submissions."}</div><a class="btn" href="#/quests">Back to quests</a>`);
    view(`<a href="#/quest/${q.n}" class="mut">← Back</a><h2>Submit Quest ${q.n}</h2><p class="mut">${e(q.title)} · Player ${e(S.sess.playerId)}</p>
    <form id="f" class="card" novalidate><label>Platform<select name="platform" required><option>Instagram</option><option>TikTok</option><option>X (Twitter)</option><option>Facebook</option><option>YouTube</option><option>Other</option></select></label>
    <label>Post URL<input name="url" type="url" inputmode="url" required placeholder="https://…"></label>
    <label>Supporting note (optional)<textarea name="note" maxlength="500" placeholder="Anything that helps us verify. Protect other people’s identities."></textarea></label>
    ${q.bonus ? `<label class="chk"><input type="checkbox" name="bonus"> <span>I completed the bonus (⭐ up to ${q.bonus} pts)</span></label>` : ""}
    <p class="mut">Need to upload a photo or screenshot? <a href="${CFG.TALLY}" target="_blank" rel="noopener">Use the Tally form</a>.</p>
    <div class="fb"></div><button type="submit">Submit Quest</button></form>`);
    form("f", async d => {
      let u; try { u = new URL(d.url) } catch (_) { throw new Error("Enter a valid post link starting with https://"); }
      if (!/^https?:$/.test(u.protocol)) throw new Error("Enter a valid post link starting with https://");
      const r = await api("submit", {quest:q.n, platform:d.platform, url:d.url, note:d.note, bonus:!!d.bonus});
      view(`<div class="card hero"><h2>Quest submitted! ✅</h2><p>Points awarded: <b class="y">+${r.awarded}</b></p><p>New total: <b class="y">${r.total} pts</b></p>
      <p class="mut">Points may be reviewed and reversed by organisers if a post doesn’t meet the rules.</p><a class="btn" href="#/dashboard">Back to dashboard</a></div>`);
    });
  } catch (x) { view(errBox(x.message)); }
}
async function leaderboard() {
  if (needLogin()) return; view(loading());
  try {
    const d = await api("leaderboard"); let tab = "individuals";
    const draw = () => {
      const rows = d[tab] || [], me = d.me || S.sess.playerId;
      view(`${banner()}<h2>Leaderboard</h2><div class="tabs" role="tablist"><button class="${tab==="individuals"?"":"ghost"}" data-t="individuals" role="tab">Individuals</button><button class="${tab==="tribes"?"":"ghost"}" data-t="tribes" role="tab">Tribes</button></div>
      <div class="card">${rows.length ? rows.map(r=>`<div class="lb ${r.isMe || r.id===me ? "me":""}"><span class="rk">${medal(r.rank)}</span><span class="nm">${e(r.name)}${r.isMe?" (you)":""}</span><span class="pt">${r.points} pts</span></div>`).join("") : `<p class="mut">No scores yet.</p>`}</div>
      <p class="mut">Updated ${d.updated ? new Date(d.updated).toLocaleString("en-GB",{timeZone:CFG.TZ}) : "–"} (Lagos). Only verified, eligible points count. Tribes are ranked by average points per registered member (roster frozen at launch). Ties: whoever reached the score first ranks higher.</p>`);
      document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { tab = b.dataset.t; draw(); });
    }; draw();
  } catch (x) { view(errBox(x.message)); }
}
async function profile() {
  if (needLogin()) return; view(loading());
  try {
    const [p, q] = await Promise.all([api("profile"), api("quests")]);
    const list = qList(q.quests), outstanding = list.filter(x => x.status === "available");
    view(`${banner()}<h2>${e(p.name)}</h2><p class="mut">${e(S.sess.playerId)} · ${e(p.tribe)}</p>
    <div class="grid"><div class="stat"><small>Total points</small><b>${p.points}</b></div><div class="stat"><small>Rank</small><b>#${p.rank ?? "–"}</b></div>
    <div class="stat"><small>Bonus points</small><b>${p.bonus ?? 0}</b></div><div class="stat"><small>Streak</small><b>🔥 ${p.streak}</b></div></div>
    <div class="card"><h3>Achievements</h3>${(p.achievements||[]).length ? p.achievements.map(a=>`<span class="pill s-available">🏅 ${e(a)}</span> `).join("") : `<p class="mut">Complete your first quest to earn a badge.</p>`}</div>
    <div class="card"><h3>Outstanding quests</h3>${outstanding.length ? outstanding.map(x=>`<p><a href="#/quest/${x.n}">#${x.n} ${e(x.title)}</a></p>`).join("") : `<p class="mut">Nothing outstanding right now.</p>`}</div>
    <div class="card"><h3>Submission history</h3>${(p.history||[]).length ? p.history.map(h=>`<div class="row" style="padding:6px 0"><span>Quest ${e(h.quest)} · <a href="${e(h.url)}" target="_blank" rel="noopener">post</a></span><b class="y">+${h.points}</b></div>`).join("") : `<p class="mut">No submissions yet.</p>`}</div>
    <form id="f" class="card"><h3>Correct my handle</h3><label>Social media handle<input name="handle" value="${e(p.handle)}" required></label><div class="fb"></div><button type="submit">Save handle</button></form>
    <form id="g" class="card"><h3>Score looks wrong?</h3><label>Tell us what happened<textarea name="msg" required></textarea></label><div class="fb"></div><button type="submit" class="ghost">Request help</button></form>
    <button class="ghost" id="out">Sign out</button>`);
    form("f", async d => { await api("updateHandle", {handle:d.handle}); $("#f .fb").innerHTML = `<div class="msg ok">Handle updated.</div>`; $("#f button").disabled = false; });
    form("g", async d => { await api("requestHelp", {message:d.msg}); $("#g .fb").innerHTML = `<div class="msg ok">Thanks. An organiser will review your request.</div>`; $("#g button").disabled = false; });
    $("#out").onclick = () => { S.sess = null; location.hash = "#/welcome"; };
  } catch (x) { view(errBox(x.message)); }
}

/* ===== ROUTER ===== */
function route() {
  const [, page, arg] = (location.hash || "#/").split("/");
  const map = {welcome, register, login, dashboard, quests, leaderboard, profile, quest:()=>questDetail(arg), submit:()=>submitPage(arg)};
  (map[page] || (S.sess ? dashboard : welcome))();
}
addEventListener("hashchange", route); route();
</script>
</body>
</html>
